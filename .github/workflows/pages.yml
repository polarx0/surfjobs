name: Deploy SurfJobs Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: surfjobs-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare bridge-safe static site
        run: |
          mkdir -p dist
          cp index.html .nojekyll dist/
          python3 - <<'PY'
          import base64
          import gzip
          import re
          from pathlib import Path

          path = Path("dist/index.html")
          text = path.read_text()

          payload_match = re.search(r"const payload = '([^']+)';", text)
          if not payload_match:
              raise SystemExit("SurfJobs payload not found")

          html = gzip.decompress(base64.b64decode(payload_match.group(1))).decode("utf-8")
          old_badge = "MVP · Greenhouse + Indeed"
          new_badge = "MVP · Greenhouse + Teamtailor + Indeed"
          if old_badge in html:
              html = html.replace(old_badge, new_badge, 1)
          elif new_badge not in html:
              raise SystemExit("Expected supported-platform badge not found")

          payload = base64.b64encode(gzip.compress(html.encode("utf-8"), mtime=0)).decode("ascii")
          text = text[:payload_match.start(1)] + payload + text[payload_match.end(1):]

          old = """    document.open();
              document.write(html);
              document.close();"""
          new = """    const parsed = new DOMParser().parseFromString(html, 'text/html');
              document.head.innerHTML = parsed.head.innerHTML;
              document.body.innerHTML = parsed.body.innerHTML;
              for (const oldScript of Array.from(document.body.querySelectorAll('script'))) {
                const script = document.createElement('script');
                for (const attr of Array.from(oldScript.attributes)) script.setAttribute(attr.name, attr.value);
                script.textContent = oldScript.textContent || '';
                oldScript.replaceWith(script);
              }"""
          if old not in text:
              raise SystemExit("Expected document.open loader block not found")
          text = text.replace(old, new, 1)

          shim = r'''<script>
          (function () {
            if (window.__SURFJOBS_TEAMTAILOR_HANDOFF__) return;
            window.__SURFJOBS_TEAMTAILOR_HANDOFF__ = true;

            function profileFromForm() {
              var ids = ["firstName","lastName","email","country","phone","location","linkedin","github",
                "workAuthorization","sponsorshipRequired","englishProficiency","salaryCurrency","salaryExpectation","resumePath"];
              var profile = {};
              ids.forEach(function (id) {
                var node = document.getElementById(id);
                if (!node) return;
                var value = String(node.value || "").trim();
                if (value) profile[id] = value;
              });
              return profile;
            }

            document.addEventListener("click", async function (event) {
              var target = event.target && event.target.closest ? event.target.closest("#continueApplication") : null;
              if (!target) return;

              var urlNode = document.getElementById("jobUrl");
              var url = urlNode ? String(urlNode.value || "").trim() : "";
              var host = "";
              try { host = new URL(url).hostname.toLowerCase(); } catch (_) { return; }
              if (!(host === "careers.investengine.com" || host.endsWith(".teamtailor.com"))) return;

              event.preventDefault();
              event.stopImmediatePropagation();
              var popup = window.open("about:blank", "_blank");
              target.disabled = true;
              target.textContent = "Opening application in Chrome…";

              try {
                var response = await fetch("/companion/profile", {
                  method: "POST",
                  headers: { "content-type": "application/json" },
                  body: JSON.stringify({ profile: profileFromForm(), applicationUrl: url })
                });
                var result = await response.json();
                if (!response.ok) throw new Error(result.message || result.error || "Could not prepare SurfJobs companion");
                if (popup) popup.location.href = url;
                else window.open(url, "_blank");

                var review = document.getElementById("review");
                if (review) review.innerHTML = '<div class="review-summary ready"><div class="review-heading"><div class="review-icon">↗</div><div><div class="review-title">Application opened in Chrome</div><div class="review-meta">Teamtailor companion mode: click Apply for this job, then Fill with SurfJobs. Final Submit remains manual.</div></div></div></div>';
              } catch (error) {
                if (popup) popup.close();
                var topError = document.getElementById("topError");
                if (topError) topError.innerHTML = '<div class="error">' + String(error && (error.message || error) || "SurfJobs companion failed") + '</div>';
              } finally {
                target.disabled = false;
                target.textContent = "Save & Open Application";
              }
            }, true);
          })();
          </script>'''
          text = text.replace("</body>", shim + "</body>", 1)
          path.write_text(text)
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
